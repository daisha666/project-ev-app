<script>
var ODDS_REFRESH_STATUS_URL = 'https://script.google.com/macros/s/AKfycbwSiLbpQnBnrikBxcpUfs_m8hUI2tO6yMOh7gMFwF18Oc1Go7jHxuuQ0L-D_FLH_0e6ig/exec?key=6fImI1UtFzsm6oNSE5k9uB4Lkpa6&action=status';
var ODDS_REFRESH_POLL_INTERVAL_SEC = 15;
var ODDS_REFRESH_MAX_WAIT_SEC = 300;

function requestOddsRefresh() {
  var btn = document.getElementById('refresh-btn');
  var status = document.getElementById('refresh-status');
  var requestedAt = new Date();
  btn.disabled = true;
  status.textContent = '更新中...';

  fetch('https://script.google.com/macros/s/AKfycbwSiLbpQnBnrikBxcpUfs_m8hUI2tO6yMOh7gMFwF18Oc1Go7jHxuuQ0L-D_FLH_0e6ig/exec?key=6fImI1UtFzsm6oNSE5k9uB4Lkpa6', { mode: 'no-cors' })
    .then(function() {
      pollOddsRefreshStatus(0, requestedAt);
    })
    .catch(function() {
      status.textContent = 'リクエストに失敗しました。時間をおいて再度お試しください。';
      btn.disabled = false;
    });
}

// completedAt（"YYYY-MM-DD HH:MM:SS"形式）が、ボタンを押した時刻より後かどうかを判定する。
// スプレッドシートに残っている「前回実行時の古い完了時刻」を、押した直後に
// 「今回分が完了した」と誤認しないようにするためのチェック
function isOddsRefreshCompletedAfter(completedAtStr, requestedAt) {
  if (!completedAtStr) return false;
  var completedAtDate = new Date(completedAtStr.replace(' ', 'T'));
  if (isNaN(completedAtDate.getTime())) return false;
  return completedAtDate > requestedAt;
}

function pollOddsRefreshStatus(elapsedSeconds, requestedAt) {
  var btn = document.getElementById('refresh-btn');
  var status = document.getElementById('refresh-status');

  fetch(ODDS_REFRESH_STATUS_URL)
    .then(function(res) { return res.json(); })
    .then(function(data) {
      var isFresh = isOddsRefreshCompletedAfter(data.completedAt, requestedAt);

      // 「待機中」（まだwatcher.pyがチェックを拾っていない）「実行中」はどちらも
      // 更新中として扱う。「完了」「エラー」も、completedAtが押した時刻より前
      // （＝前回実行時の古い結果）ならまだ今回分ではないので更新中のまま続ける
      if (data.status === '完了' && isFresh) {
        var timeText = data.completedAt.split(' ').pop();
        status.textContent = '更新完了（' + timeText + '）。ページを再読み込みして最新の内容を確認してください。';
        btn.disabled = false;
        return;
      }
      if (data.status === 'エラー' && isFresh) {
        status.textContent = '更新処理でエラーが発生しました。時間をおいて再度お試しください。';
        btn.disabled = false;
        return;
      }
      scheduleNextOddsRefreshPoll(elapsedSeconds, requestedAt);
    })
    .catch(function() {
      scheduleNextOddsRefreshPoll(elapsedSeconds, requestedAt);
    });
}

function scheduleNextOddsRefreshPoll(elapsedSeconds, requestedAt) {
  var btn = document.getElementById('refresh-btn');
  var status = document.getElementById('refresh-status');
  var next = elapsedSeconds + ODDS_REFRESH_POLL_INTERVAL_SEC;

  if (next >= ODDS_REFRESH_MAX_WAIT_SEC) {
    status.textContent = '反映に時間がかかっています。しばらくしてページを再読み込みしてください。';
    btn.disabled = false;
    return;
  }

  status.textContent = '更新中...（' + next + '秒経過）';
  setTimeout(function() { pollOddsRefreshStatus(next, requestedAt); }, ODDS_REFRESH_POLL_INTERVAL_SEC * 1000);
}
</script>
